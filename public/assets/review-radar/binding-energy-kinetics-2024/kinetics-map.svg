<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Binding equilibrium and kinetic barriers</title>
  <desc id="desc">An original conceptual diagram, not experimental data. Reversible P plus L binding forms PL. The free energy difference between states describes equilibrium; activation barriers describe association and dissociation. Ka equals kon divided by koff in a simple two-state model.</desc>
  <defs>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#22584e"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#9a641f"/></marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#788b81"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="648" rx="18" fill="#fff" stroke="#d5dfd5"/>
  <g font-family="Arial, sans-serif" fill="#173e37">
    <text x="40" y="46" font-size="21" font-weight="bold">Two states, two different questions</text>
    <text x="40" y="74" font-size="15" fill="#677c70">Conceptual illustration · no measured energy scale</text>
    <rect x="60" y="96" width="240" height="104" rx="12" fill="#eef4ed"/>
    <rect x="700" y="96" width="240" height="104" rx="12" fill="#e4eeea"/>
    <text x="180" y="143" font-size="29" text-anchor="middle">P + L</text>
    <text x="180" y="176" font-size="15" text-anchor="middle">Unbound</text>
    <text x="820" y="143" font-size="29" text-anchor="middle">PL</text>
    <text x="820" y="176" font-size="15" text-anchor="middle">Bound</text>
    <path d="M335 136H663" stroke="#22584e" stroke-width="2.5" marker-end="url(#green-arrow)"/>
    <path d="M665 171H337" stroke="#9a641f" stroke-width="2.5" marker-end="url(#amber-arrow)"/>
    <text x="500" y="123" text-anchor="middle" font-size="19">k<tspan baseline-shift="sub" font-size="13">on</tspan><tspan> [M⁻¹ s⁻¹]</tspan></text>
    <text x="500" y="197" text-anchor="middle" font-size="19" fill="#9a641f">k<tspan baseline-shift="sub" font-size="13">off</tspan><tspan> [s⁻¹]</tspan></text>
    <path d="M100 530V243 M100 530H920" fill="none" stroke="#788b81" stroke-width="1.8" marker-end="url(#axis-arrow)"/>
    <text x="58" y="392" font-size="17" text-anchor="middle" transform="rotate(-90 58 392)">Gibbs free energy</text>
    <text x="510" y="564" font-size="17" text-anchor="middle">Reaction coordinate</text>
    <path d="M160 385H270 M350 265H830 M640 470H830" fill="none" stroke="#b4c3b8" stroke-dasharray="6 5" stroke-width="1.5"/>
    <path d="M160 385C252 385 306 265 405 265C517 265 533 470 675 470C734 470 776 448 825 422" fill="none" stroke="#22584e" stroke-width="4" stroke-linecap="round"/>
    <text x="154" y="370" font-size="21">P + L</text>
    <text x="672" y="503" font-size="21">PL</text>
    <text x="405" y="244" font-size="15" text-anchor="middle">Transition state</text>
    <path d="M284 385V268" stroke="#9a641f" stroke-width="2" marker-end="url(#amber-arrow)"/>
    <text x="270" y="323" text-anchor="end" font-size="18" fill="#9a641f">ΔG‡<tspan baseline-shift="sub" font-size="12">on</tspan></text>
    <path d="M800 470V268" stroke="#9a641f" stroke-width="2" marker-end="url(#amber-arrow)"/>
    <text x="814" y="347" font-size="18" fill="#9a641f">ΔG‡<tspan baseline-shift="sub" font-size="12">off</tspan></text>
    <path d="M172 391V468" stroke="#22584e" stroke-width="2" marker-end="url(#green-arrow)"/>
    <text x="187" y="436" font-size="18">ΔG°<tspan baseline-shift="sub" font-size="12">bind</tspan><tspan> &lt; 0</tspan></text>
    <rect x="42" y="590" width="916" height="40" rx="8" fill="#f4f6f1"/>
    <text x="500" y="616" font-size="17" text-anchor="middle">K<tspan baseline-shift="sub" font-size="12">a</tspan> = k<tspan baseline-shift="sub" font-size="12">on</tspan> / k<tspan baseline-shift="sub" font-size="12">off</tspan>     ·     ΔG°<tspan baseline-shift="sub" font-size="12">bind</tspan> = −RT ln(K<tspan baseline-shift="sub" font-size="12">a</tspan>C°)     ·     τ = 1 / k<tspan baseline-shift="sub" font-size="12">off</tspan></text>
  </g>
</svg>

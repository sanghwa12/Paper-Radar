<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" role="img"><title>연구 흐름 요약</title><g font-family="Malgun Gothic,Arial,sans-serif"><rect x="30" y="20" width="840" height="70" rx="12" fill="#f1f6ef" stroke="#bfd1bd"/><text x="55" y="48" fill="#285c43" font-size="20" font-weight="600">표적–proteasome 직접 연결</text><text x="55" y="73" fill="#485e50" font-size="15">표적 인식 항체와 PSMD4/ADRM1 결합체의 기능 검증</text><path d="M450 93v13m-5-5 5 5 5-5" fill="none" stroke="#608b6c" stroke-width="2"/><rect x="30" y="112" width="840" height="70" rx="12" fill="#f1f6ef" stroke="#bfd1bd"/><text x="55" y="140" fill="#285c43" font-size="20" font-weight="600">기전 대조군</text><text x="55" y="165" fill="#485e50" font-size="15">분리된 두 모듈·proteasome/E1 억제·mRNA를 비교</text><path d="M450 185v13m-5-5 5 5 5-5" fill="none" stroke="#608b6c" stroke-width="2"/><rect x="30" y="204" width="840" height="70" rx="12" fill="#f1f6ef" stroke="#bfd1bd"/><text x="55" y="232" fill="#285c43" font-size="20" font-weight="600">선택성과 작동 범위</text><text x="55" y="257" fill="#485e50" font-size="15">endogenous c-Fos/BRD4, tag 모델, TMT proteomics 비교</text><path d="M450 277v13m-5-5 5 5 5-5" fill="none" stroke="#608b6c" stroke-width="2"/><rect x="30" y="296" width="840" height="70" rx="12" fill="#f1f6ef" stroke="#bfd1bd"/><text x="55" y="324" fill="#285c43" font-size="20" font-weight="600">생체 효과와 전달</text><text x="55" y="349" fill="#485e50" font-size="15">stable-cell tumor와 AAV·mRNA-LNP 전달 실험을 구분</text></g></svg>
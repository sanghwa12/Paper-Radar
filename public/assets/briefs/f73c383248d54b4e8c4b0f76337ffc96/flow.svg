<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img">
<title>MTS 반응의 판독 변경 → 화학적 검증 → 세포·조직 검증</title>
<rect width="1200" height="280" rx="20" fill="#f6f4f0"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93847b"/></marker></defs>
<g font-family="Malgun Gothic, sans-serif">
<text x="30" y="39" font-size="19" font-weight="700" fill="#43382f">MTS 반응의 판독 변경 → 화학적 검증 → 세포·조직 검증</text>
<path d="M298 139 L317 139" stroke="#93847b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="71" width="268" height="167" rx="12" fill="#fff" stroke="#e0d6cc"/>
<text x="46" y="101" font-size="14" fill="#a45d38">01</text>
<text x="46" y="135" font-size="19" font-weight="700" fill="#2f2823">NADH 기준 반응</text>
<text x="46" y="165" font-size="15" fill="#675d55">MTS-formazan 생성</text>
<text x="46" y="189" font-size="15" fill="#675d55">배지·시약 blank 확인</text>
<path d="M592 139 L611 139" stroke="#93847b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="322" y="71" width="268" height="167" rx="12" fill="#fff" stroke="#e0d6cc"/>
<text x="340" y="101" font-size="14" fill="#a45d38">02</text>
<text x="340" y="135" font-size="19" font-weight="700" fill="#2f2823">두 판독법 비교</text>
<text x="340" y="165" font-size="15" fill="#675d55">전류 vs 490 nm 흡광</text>
<text x="340" y="189" font-size="15" fill="#675d55">선형성·측정 변동 비교</text>
<path d="M886 139 L905 139" stroke="#93847b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="616" y="71" width="268" height="167" rx="12" fill="#fff" stroke="#e0d6cc"/>
<text x="634" y="101" font-size="14" fill="#a45d38">03</text>
<text x="634" y="135" font-size="19" font-weight="700" fill="#2f2823">2D 세포 검증</text>
<text x="634" y="165" font-size="15" fill="#675d55">hDF·N/TERT-1</text>
<text x="634" y="189" font-size="15" fill="#675d55">세포 밀도와 독성 패널</text>
<rect x="910" y="71" width="268" height="167" rx="12" fill="#fff" stroke="#e0d6cc"/>
<text x="928" y="101" font-size="14" fill="#a45d38">04</text>
<text x="928" y="135" font-size="19" font-weight="700" fill="#2f2823">3D RHE 검증</text>
<text x="928" y="165" font-size="15" fill="#675d55">60분 노출·42시간 회복</text>
<text x="928" y="189" font-size="15" fill="#675d55">생존율 및 H&amp;E 확인</text>
</g></svg>
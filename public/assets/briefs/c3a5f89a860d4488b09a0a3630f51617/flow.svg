<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" role="img"><title>연구 흐름 요약</title><g font-family="Malgun Gothic,Arial,sans-serif"><rect x="30" y="20" width="840" height="70" rx="12" fill="#f1f6ef" stroke="#bfd1bd"/><text x="55" y="48" fill="#285c43" font-size="20" font-weight="600">세포에서의 유효성</text><text x="55" y="73" fill="#485e50" font-size="15">감염된 H9c2에서 parasite 감소와 host-cell 생존을 함께 측정</text><path d="M450 93v13m-5-5 5 5 5-5" fill="none" stroke="#608b6c" stroke-width="2"/><rect x="30" y="112" width="840" height="70" rx="12" fill="#f1f6ef" stroke="#bfd1bd"/><text x="55" y="140" fill="#285c43" font-size="20" font-weight="600">경구 노출과 생체 효과</text><text x="55" y="165" fill="#485e50" font-size="15">IV·PO의 서로 다른 용량을 구분하고 급성 모델의 혈액·조직 결과 비교</text><path d="M450 185v13m-5-5 5 5 5-5" fill="none" stroke="#608b6c" stroke-width="2"/><rect x="30" y="204" width="840" height="70" rx="12" fill="#f1f6ef" stroke="#bfd1bd"/><text x="55" y="232" fill="#285c43" font-size="20" font-weight="600">표적과 결합 위치</text><text x="55" y="257" fill="#485e50" font-size="15">AMP 생성 assay·DSF·X-ray로 ATP pocket 결합 근거를 연결</text><path d="M450 277v13m-5-5 5 5 5-5" fill="none" stroke="#608b6c" stroke-width="2"/><rect x="30" y="296" width="840" height="70" rx="12" fill="#f1f6ef" stroke="#bfd1bd"/><text x="55" y="324" fill="#285c43" font-size="20" font-weight="600">다음 판단</text><text x="55" y="349" fill="#485e50" font-size="15">만성기·재발·human LysRS 선택성은 추가 검증이 필요</text></g></svg>
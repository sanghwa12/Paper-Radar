<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">iMQT_020: 계산에서 동물 실험까지의 근거 흐름</title><desc id="desc">Sung 등 2025 논문의 보고 내용을 독립적으로 구성한 연구 흐름도. 예측 구조와 실험 근거를 구분함.</desc>
<style>text{font-family:'Malgun Gothic',Arial,sans-serif;fill:#153940}.h{font-size:21px;font-weight:700}.b{font-size:17px}.s{font-size:15px;fill:#52676a}.n{font-size:14px;fill:#087e80;font-weight:700}</style>
<rect width="1200" height="660" rx="20" fill="#f3f7f5"/>
<text x="38" y="47" class="h">계산 가설이 실험 근거로 이어지는 과정</text><text x="38" y="76" class="s">원본 그림의 복제가 아닌 내용 기반 도식 · 화살표는 연구 순서이며 인과관계의 확정 정도를 뜻하지 않음</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#789798" stroke-width="1.5"/></marker></defs>
<g fill="white" stroke="#d6e1dd"><rect x="35" y="106" width="355" height="200" rx="14"/><rect x="422" y="106" width="355" height="200" rx="14"/><rect x="809" y="106" width="355" height="200" rx="14"/><rect x="35" y="362" width="355" height="200" rx="14"/><rect x="422" y="362" width="355" height="200" rx="14"/><rect x="809" y="362" width="355" height="200" rx="14"/></g>
<g stroke="#789798" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M392 205 H418"/><path d="M779 205 H805"/><path d="M986 310 V330 H212 V358"/><path d="M392 460 H418"/><path d="M779 460 H805"/></g>
<text x="56" y="137" class="n">01 / 구조 가설</text><text x="56" y="172" class="h">RoseTTAFold2 → MZ-Dock</text><text x="56" y="207" class="b">생화학 결과에 맞는 삼량체 모델 선택</text><text x="56" y="238" class="b">F97 · I104 · L105 접촉 부위 탐색</text><text x="56" y="278" class="s">예측 구조 · Fig. 1A–B / Methods pp.18–19</text>
<text x="443" y="137" class="n">02 / 후보 발굴</text><text x="443" y="172" class="h">120만 개 → 103개 시험</text><text x="443" y="207" class="b">Glide HTVS → SP → XP + 육안 검토</text><text x="443" y="238" class="b">10 μM 미토콘드리아 수송 스크리닝</text><text x="443" y="278" class="s">iMQT_020 선정 · Fig. 1C / p.19</text>
<text x="830" y="137" class="n">03 / 결합·기능</text><text x="830" y="172" class="h">K<tspan baseline-shift="sub" font-size="14">d</tspan> 4.473 μM</text><text x="830" y="207" class="b">MST + 변이체 + SEC/CD</text><text x="830" y="238" class="b">글루타민 수송 IC₅₀ 6.156 μM</text><text x="830" y="278" class="s">직접 결합·수송 측정 · Fig. 1G–M</text>
<text x="56" y="393" class="n">04 / 대사 연결</text><text x="56" y="428" class="h">동위원소 추적 + 구제 실험</text><text x="56" y="463" class="b">¹³C₅-Gln · 10 μM · 0/12/24 h</text><text x="56" y="494" class="b">TCA 표지 대사체↓ · DM-αKG로 구제</text><text x="56" y="534" class="s">LC-MS/MS · OCR · Fig. 2–3</text>
<text x="443" y="393" class="n">05 / 세포·오가노이드</text><text x="443" y="428" class="h">43개 암 + 7개 정상 세포주</text><text x="443" y="463" class="b">10 μM · 48 h · WST-1</text><text x="443" y="494" class="b">환자 유래 PDAC 오가노이드 검증</text><text x="443" y="534" class="s">세포 생존·감수성 연관 · Fig. 4</text>
<text x="830" y="393" class="n">06 / 전임상 확장</text><text x="830" y="428" class="h">종양 억제 + 면역치료 병용</text><text x="830" y="463" class="b">단독 75 mg/kg · IP · 매일</text><text x="830" y="494" class="b">병용 25 mg/kg + anti-PD-L1</text><text x="830" y="534" class="s">생쥐 근거 · Fig. 5, 7 / 사람 효능 미검증</text>
<text x="38" y="607" class="s">출처: Sung et al., Nature Communications 16, 9690 (2025) · doi:10.1038/s41467-025-64730-2</text><text x="38" y="633" class="s">본문 기반 재구성 · 별도 Supplementary Information 및 Source Data는 검토하지 않음</text></svg>